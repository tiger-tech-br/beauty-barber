name: beautybarber

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [beautybarber_private]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:?Defina WEB_ORIGIN}
      SESSION_COOKIE_NAME: beautybarber_session
      SUBSCRIPTION_ENFORCEMENT: ${SUBSCRIPTION_ENFORCEMENT:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [beautybarber_private]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # Somente no próprio servidor. A porta 80/443 pública pertence ao proxy já existente (PetCore).
      - "127.0.0.1:${BEAUTYBARBER_LOCAL_PORT:-18080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [beautybarber_private]

volumes:
  postgres_data:
    name: beautybarber_postgres_data
  caddy_data:
    name: beautybarber_caddy_data
  caddy_config:
    name: beautybarber_caddy_config

networks:
  beautybarber_private:
    name: beautybarber_private
    driver: bridge

