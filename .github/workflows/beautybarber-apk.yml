name: BeautyBarber APK debug

on:
  push:
    branches: [main]
    paths:
      - 'android-beautybarber/**'
      - '.github/workflows/beautybarber-apk.yml'
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Origem HTTPS pública do BeautyBarber (sem barra final)'
        required: true
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BEAUTYBARBER_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.website_url || 'https://beautybarber.tigertech.dev.br' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Verificar URL segura do BeautyBarber
        run: |
          if [[ ! "$BEAUTYBARBER_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo 'Informe apenas a origem HTTPS, sem porta, caminho ou parâmetros.' >&2
            exit 1
          fi
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK de desenvolvimento
        working-directory: android-beautybarber
        run: gradle :app:assembleDebug "-PbeautybarberUrl=${BEAUTYBARBER_URL}"
      - name: Gerar hash SHA-256 do APK
        working-directory: android-beautybarber
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: beautybarber-apk-debug
          path: |
            android-beautybarber/app/build/outputs/apk/debug/app-debug.apk
            android-beautybarber/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
